project:
  type: website
  output-dir: _site
  preview: 
    watch-inputs: true
  resources: 
    - assets/**
    - CNAME

website:
  title: "Ryan O'Loughlin"
  description: "philosophy of science • climate models • trust without truth • uncertainty"
  site-url: https://ryanoloughlin.org/
  favicon: assets/headshot.jpg
  open-graph:
    image: assets/og-card.jpeg
    image-alt: "Ryan O'Loughlin — Philosophy of Science (climate models, uncertainty)"
  twitter-card:
    image: assets/og-card.jpeg
    card-style: summary_large_image
  navbar:
    collapse-below: lg
    left:
      - text: Research
        href: research.qmd
      - text: Publications
        href: publications.qmd
      - text: Talks
        href: talks/index.qmd
      - text: Teaching
        href: teaching.qmd
      - text: About
        href: about.qmd
      - text: Contact
        href: contact.qmd
    right:
      - text: CV
        href: files/Ryan_OLoughlin_CV.pdf
  page-footer:
    center: 
      - text: "© Ryan J. O'Loughlin"
      - text: "CC BY 4.0"
        href: https://creativecommons.org/licenses/by/4.0/
    left:
      - icon: envelope
        #text: Email
        href: "mailto:ryan.oloughlin@qc.cuny.edu"
      - icon: google
        #text: Scholar
        href: https://scholar.google.com/citations?user=FVgAseQAAAAJ&hl=en
      - icon: mortarboard 
        text: PhilPeople  
        href: https://philpeople.org/profiles/ryan-o-loughlin
      - icon: orcid
        text: ORCID
        href: https://orcid.org/0000-0002-9106-1460
      - icon: github
        #text: GitHub
        href: https://github.com/Ryan-J-OLoughlin/
      - icon: linkedin
        #text: LinkedIn
        href: https://www.linkedin.com/in/ryan-o-loughlin-885256300/
    right:
      - text: "Back to top ↑"
        href: "#"
      - text: "Built by danlio.studio"
        href: https://danlio.studio
  search: true
  repo-url: https://github.com/Ryan-J-OLoughlin/Ryan-J-OLoughlin.github.io
  repo-actions: [edit, issue]

format:
  html:
    lang: en
    page-layout: article
    theme:
      light: [default, theme/base.scss, theme/light.scss]
      dark: [default, theme/base.scss, theme/dark.scss]
    respect-user-color-scheme: true
    include-in-header:
      - _includes/head.html
    filters:
      - filters/seo.lua
    toc: true
    toc-location: right
    page-navigation: true
    smooth-scroll: true
    metadata:
      author: "Ryan J. O'Loughlin"
      keywords:
        - philosophy of science
        - climate models
        - uncertainty
        - trust without truth
        - decision-making under uncertainty
